<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101f"><title>Messi vs Ronaldo GOAT Scoreboard</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#07101f;color:#fff;font-family:Arial,Helvetica,sans-serif}body{padding:0 0 14px}.game{position:relative;width:100%;max-width:1600px;margin:auto;aspect-ratio:1536/865;background:#07101f url('goat-bg.png') center center/100% 100% no-repeat;overflow:hidden}.live-score{position:absolute;left:43.2%;top:0.8%;width:13.6%;height:7.2%;display:flex;align-items:center;justify-content:center;gap:9%;background:linear-gradient(180deg,rgba(4,12,28,.97),rgba(8,20,39,.94));border:2px solid #55b9ff;border-radius:10px;color:#fff;font-weight:900;font-size:clamp(20px,4.2vw,64px);line-height:1;text-shadow:0 2px 5px #000;font-variant-numeric:tabular-nums;box-shadow:0 0 14px #168bff88}.live-score .dash{font-size:.68em;color:#dcecff}.live-clock{position:absolute;top:10.6%;left:44.2%;width:11.6%;text-align:center;font-weight:900;font-size:clamp(11px,2.2vw,30px);text-shadow:0 2px 5px #000;color:#fff;letter-spacing:.03em}.side-score{position:absolute;top:15%;min-width:12%;padding:5px 10px;border-radius:8px;text-align:center;font-weight:900;font-size:clamp(11px,1.6vw,24px);text-shadow:0 2px 4px #000;box-shadow:0 3px 12px #0007}.side-score.m{left:25%;background:#075ec5d9;border:1px solid #65baff}.side-score.r{right:25%;background:#bd201bd9;border:1px solid #ff8b81}.last-event{position:absolute;left:50%;top:71%;transform:translateX(-50%);max-width:90%;padding:7px 16px;border-radius:8px;background:#07101fce;border:1px solid #ffffff55;font-weight:900;font-size:clamp(14px,2.6vw,38px);text-align:center;white-space:nowrap;text-shadow:0 2px 4px #000;opacity:0;transition:opacity .2s}.last-event.show{opacity:1}.controls{width:min(100% - 20px,1000px);margin:12px auto 0;display:grid;gap:10px}.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px}.score-card{padding:10px;border-radius:10px;background:#101c31;border:1px solid #2b4164;text-align:center}.score-card strong{display:block;font-size:clamp(14px,3vw,20px);letter-spacing:.04em}.score-card span{display:block;font-size:clamp(28px,6vw,44px);font-weight:900;line-height:1.15;font-variant-numeric:tabular-nums}.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}button{min-height:44px;border:0;border-radius:8px;color:#fff;font-size:clamp(12px,2.4vw,16px);font-weight:800;padding:8px 5px;cursor:pointer}.mg{background:#0876e5}.mn{background:#24415f}.rg{background:#df3029}.rn{background:#5b2529}.bottom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.bottom button{background:#17243a;border:1px solid #3a4a66}.hint{text-align:center;color:#b9c6da;font-size:12px;line-height:1.4}@media(max-width:520px){.game{background-size:100% 100%}.side-score{top:15%;padding:3px 5px}.side-score.m{left:23%}.side-score.r{right:23%}.last-event{top:70%;padding:5px 8px}.actions{gap:5px}.controls{width:calc(100% - 12px);margin-top:7px}.score-card{padding:7px 4px}.live-score{border-width:1px;border-radius:6px;gap:5%}}
</style></head>
<body>
<main class="game" aria-label="Messi versus Ronaldo score game">
  <div class="live-score"><span id="mainM">0</span><span class="dash">-</span><span id="mainR">0</span></div>
  <div class="live-clock" id="clock">00:00</div>
  <div class="side-score m">MESSI GOALS: <span id="miniM">0</span></div>
  <div class="side-score r">RONALDO GOALS: <span id="miniR">0</span></div>
  <div class="last-event" id="event" aria-live="polite"></div>
</main>
<section class="controls">
  <div class="scores">
    <div class="score-card"><strong>MESSI · 10</strong><span id="cardM">0</span></div>
    <div class="score-card"><strong>RONALDO · 7</strong><span id="cardR">0</span></div>
  </div>
  <div class="actions">
    <button class="mg" id="mGoal">MESSI GOAL</button><button class="mn" id="mMiss">MESSI NO GOAL</button>
    <button class="rg" id="rGoal">RONALDO GOAL</button><button class="rn" id="rMiss">RONALDO NO GOAL</button>
  </div>
  <div class="bottom"><button id="sound">VOICE: ON</button><button id="timer">TIMER: ON</button><button id="reset">RESET SCORE</button></div>
  <div class="hint">Tap the matching result after each attempt. Goal counters update instantly and the voice chant announces who scored.</div>
</section>
<script>
(()=>{'use strict';let m=0,r=0,seconds=0,voiceOn=true,timerOn=true,last=Date.now();const $=id=>document.getElementById(id);function draw(){['mainM','miniM','cardM'].forEach(id=>$(id).textContent=m);['mainR','miniR','cardR'].forEach(id=>$(id).textContent=r);$('clock').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function say(text){if(!voiceOn||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=1.05;u.pitch=1.05;const vs=speechSynthesis.getVoices();const v=vs.find(x=>/en-US/i.test(x.lang))||vs.find(x=>/^en/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
let eventTimer;function announce(text,goal){const el=$('event');el.textContent=text;el.style.color=goal?'#ffe66a':'#fff';el.classList.add('show');clearTimeout(eventTimer);eventTimer=setTimeout(()=>el.classList.remove('show'),2600)}function result(who,goal){if(who==='m'){if(goal)m++;say(goal?'Messi! Messi! Messi! Goal! Goal! Goal! Goal!':'Messi! Messi! Messi! No goal!');announce(goal?'MESSI SCORES! ⚽':'MESSI — NO GOAL',goal)}else{if(goal)r++;say(goal?'Ronaldo! Ronaldo! Ronaldo! Goal! Goal! Goal! Goal!':'Ronaldo! Ronaldo! Ronaldo! No goal!');announce(goal?'RONALDO SCORES! ⚽':'RONALDO — NO GOAL',goal)}draw()}
$('mGoal').onclick=()=>result('m',true);$('mMiss').onclick=()=>result('m',false);$('rGoal').onclick=()=>result('r',true);$('rMiss').onclick=()=>result('r',false);$('reset').onclick=()=>{m=0;r=0;seconds=0;draw();$('event').classList.remove('show');if('speechSynthesis'in window)speechSynthesis.cancel()};$('sound').onclick=()=>{voiceOn=!voiceOn;$('sound').textContent='VOICE: '+(voiceOn?'ON':'OFF');if(!voiceOn&&'speechSynthesis'in window)speechSynthesis.cancel()};$('timer').onclick=()=>{timerOn=!timerOn;$('timer').textContent='TIMER: '+(timerOn?'ON':'OFF')};setInterval(()=>{const now=Date.now();if(timerOn)seconds+=Math.max(0,Math.floor((now-last)/1000));last=now;draw()},250);draw();if('speechSynthesis'in window)speechSynthesis.getVoices();})();
</script></body></html>
